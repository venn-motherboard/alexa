<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programmer Profile</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">

<!-- ========== INTRO ========== -->
<div id="intro" aria-hidden="true">
  <div class="streak"></div><div class="streak"></div><div class="streak"></div><div class="streak"></div>
  <div class="emblem">
    <!-- Original emblem: a checkered-flag-style chevron with code brackets. NOT the official F1 logo. -->
    <svg viewBox="0 0 240 140" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path class="draw" d="M20 120 L90 20 H150 L100 90 H160" stroke="#e10600" stroke-width="12"/>
      <path class="draw" d="M130 120 L190 40 H225" stroke="#fff" stroke-width="8"/>
      <text x="14" y="136" fill="#fff" font-family="monospace" font-size="14" stroke="none">&lt;/&gt;</text>
    </svg>
    <p>INITIALIZING PROFILE...</p>
    <div class="bar"><i></i></div>
  </div>
</div>

<!-- ========== HERO ========== -->
<header class="hero" id="top">
  <div class="wrap">
    <p class="mono">// software development portfolio</p>
    <h1 id="hero-name">Hello, I'm <span>Alexa Abad</span></h1>
    <div class="term mono"><b>$</b> whoami → <span id="hero-role">student developer</span><span class="cursor"></span></div>
    <div>
      <a class="btn" href="#info">My Profile</a>
      <a class="btn" href="#projects">Projects</a>
    </div>
  </div>
</header>

<main>
<!-- ========== PERSONAL INFO ========== -->
<section id="info"><div class="wrap">
  <h2 class="reveal">Personal Information</h2>
  <div class="grid" id="info-grid"></div>
</div></section>

<!-- ========== EDUCATION (incl. achievements) ========== -->
<section id="education"><div class="wrap">
  <h2 class="reveal">Educational Background</h2>
  <div class="timeline" id="edu-list"></div>
</div></section>

<!-- ========== SKILLS ========== -->
<section id="skills"><div class="wrap">
  <h2 class="reveal">Skills</h2>
  <div class="chips reveal" id="skill-list"></div>
</div></section>

<!-- ========== PROJECTS ========== -->
<section id="projects"><div class="wrap">
  <h2 class="reveal">Projects</h2>
  <div class="grid" id="project-list"></div>
</div></section>
</main>

<footer><p class="mono">&lt;/&gt; built with HTML, CSS &amp; JavaScript — <span id="foot-name">[MY NAME]</span></p></footer>

<script src="script.js"></script>
</body>
</html>
